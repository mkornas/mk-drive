# main → test → ghcr.io/mkornas/mk-drive:{latest,<sha>} → an optional deploy hook.
# Set the DEPLOY_HOOK_URL variable (e.g. watchtower's HTTP API) to ask a server to pull now;
# without it, or if the hook fails, a server that polls for new images picks it up later.
name: Deploy
on:
  push:
    branches: [main]
    # the image is built from shared/, client/ and server/ only; a board or docs commit must not restart the drive
    paths-ignore:
      - 'board.md'
      - 'notes/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docker-compose.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/mkornas/mk-drive
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck && npm test
        working-directory: server

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Call the deploy hook
        if: vars.DEPLOY_HOOK_URL != ''
        env:
          HOOK: ${{ vars.DEPLOY_HOOK_URL }}
          TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 120 -X POST \
            -H "Authorization: Bearer $TOKEN" "$HOOK?image=$IMAGE" || true)
          echo "deploy hook responded $code"
          [ "$code" = 200 ] || echo "::warning::trigger failed ($code); a periodic pull will pick the image up"
